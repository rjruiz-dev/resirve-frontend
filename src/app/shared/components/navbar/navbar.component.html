<nav class="navbar">
  <div class="navbar-container">
    <!-- Logo -->
    <a routerLink="/" class="navbar-brand" (click)="closeMenu()">
      <span class="brand-re">Re</span><span class="brand-sirve">Sirve</span>
      <span class="brand-tagline">Productos con Historia</span>
    </a>

    <!-- Toggle móvil -->
    <button 
      class="navbar-toggler" 
      type="button"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen()"
      aria-label="Toggle navigation">
      <span class="navbar-toggler-icon">
        @if (menuOpen()) {
          <i class="bi bi-x-lg"></i>
        } @else {
          <i class="bi bi-list"></i>
        }
      </span>
    </button>

    <!-- Menú de navegación -->
    <div class="navbar-menu" [class.active]="menuOpen()">
      <ul class="navbar-nav">
        <li class="nav-item">
          <a 
            routerLink="/" 
            routerLinkActive="active" 
            [routerLinkActiveOptions]="{exact: true}"
            class="nav-link"
            (click)="closeMenu()">
            <i class="bi bi-house-door"></i>
            <span>Inicio</span>
          </a>
        </li>
        
        <li class="nav-item">
          <a 
            routerLink="/catalogo" 
            routerLinkActive="active"
            class="nav-link"
            (click)="closeMenu()">
            <i class="bi bi-grid-3x3-gap"></i>
            <span>Catálogo</span>
          </a>
        </li>
        
        <li class="nav-item">
          <a 
            routerLink="/acerca-de" 
            routerLinkActive="active"
            class="nav-link"
            (click)="closeMenu()">
            <i class="bi bi-info-circle"></i>
            <span>Acerca de</span>
          </a>
        </li>
        
        <li class="nav-item">
          <a 
            routerLink="/contacto" 
            routerLinkActive="active"
            class="nav-link"
            (click)="closeMenu()">
            <i class="bi bi-envelope"></i>
            <span>Contacto</span>
          </a>
        </li>
      </ul>

      <!-- CTA Button -->
      <div class="navbar-actions">
        <a routerLink="/catalogo" class="btn-primary" (click)="closeMenu()">
          Ver Productos
        </a>
      </div>
    </div>
  </div>
</nav>
