<nav class="navbar">
  <div class="navbar-container">
    <!-- Logo -->
    <a routerLink="/" class="navbar-brand" (click)="closeMenu()">
      <span class="brand-re">Re</span><span class="brand-sirve">Sirve</span>
      <span class="brand-tagline">Productos con Historia</span>
    </a>

    <!-- Barra de búsqueda centrada (oculta en móvil) -->
    <div class="navbar-search">
      <i class="bi bi-search"></i>
      <input
        type="text"
        placeholder="Buscar productos..."
        aria-label="Buscar productos"
      />
    </div>

    <!-- Toggle móvil -->
    <button
      class="navbar-toggler"
      type="button"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen()"
      aria-label="Toggle navigation">
      <span class="navbar-toggler-icon">
        @if (menuOpen()) {
          <i class="bi bi-x-lg"></i>
        } @else {
          <i class="bi bi-list"></i>
        }
      </span>
    </button>

    <!-- Menú de navegación -->
    <div class="navbar-menu" [class.active]="menuOpen()">
      <ul class="navbar-nav">
        <li class="nav-item">
          <a
            routerLink="/"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{exact: true}"
            class="nav-link"
            (click)="closeMenu()">
            <span>Inicio</span>
          </a>
        </li>

        <li class="nav-item">
          <a
            routerLink="/catalogo"
            routerLinkActive="active"
            class="nav-link"
            (click)="closeMenu()">
            <span>Catálogo</span>
          </a>
        </li>

        <li class="nav-item">
          <a
            routerLink="/acerca-de"
            routerLinkActive="active"
            class="nav-link"
            (click)="closeMenu()">
            <span>Acerca de</span>
          </a>
        </li>

        <li class="nav-item">
          <a
            routerLink="/contacto"
            routerLinkActive="active"
            class="nav-link"
            (click)="closeMenu()">
            <span>Contacto</span>
          </a>
        </li>
      </ul>

      <!-- Theme Toggle -->
      <button
        class="navbar-theme-toggle"
        type="button"
        (click)="themeService.toggle()"
        [attr.aria-label]="themeService.theme() === 'dark' ? 'Activar modo claro' : 'Activar modo oscuro'">
        @if (themeService.theme() === 'dark') {
          <i class="bi bi-sun-fill"></i>
        } @else {
          <i class="bi bi-moon-fill"></i>
        }
      </button>
    </div>
  </div>
</nav>
