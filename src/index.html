<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>ReSirve - Productos Usados con Historia</title>
  <base href="/">
  
  <!-- Meta tags para SEO y redes sociales -->
  <meta name="description" content="ReSirve - Encuentra productos usados en excelente estado. Cada artículo tiene su historia. Compra y vende de forma directa y honesta.">
  <meta name="keywords" content="productos usados, segunda mano, marketplace, compra venta, artículos usados, productos reacondicionados">
  <meta name="author" content="ReSirve">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://resirve.com/">
  <meta property="og:title" content="ReSirve - Productos Usados con Historia">
  <meta property="og:description" content="Encuentra productos usados en excelente estado. Cada artículo tiene su historia.">
  <meta property="og:image" content="/assets/images/og-image.jpg">
  
  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="https://resirve.com/">
  <meta property="twitter:title" content="ReSirve - Productos Usados con Historia">
  <meta property="twitter:description" content="Encuentra productos usados en excelente estado. Cada artículo tiene su historia.">
  <meta property="twitter:image" content="/assets/images/og-image.jpg">
  
  <!-- PWA -->
  <meta name="theme-color" content="#E07856">
  <link rel="manifest" href="manifest.webmanifest">
  
  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png">
  
  <!-- Preconnect a Google Fonts para mejorar performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Script inicial de tema: previene FOUC antes de que Angular cargue -->
  <script>
    (function() {
      var saved = localStorage.getItem('resirve-theme');
      var preferred = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      var theme = saved || preferred;
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body>
  <!-- El componente raíz de Angular se renderiza aquí -->
  <app-root>
    <!-- Loading inicial mientras carga Angular -->
    <div style="
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: #FAF7F2;
      font-family: 'Work Sans', sans-serif;
    ">
      <div style="text-align: center;">
        <!-- Logo o spinner -->
        <div style="
          width: 60px;
          height: 60px;
          border: 4px solid rgba(224, 120, 86, 0.2);
          border-top-color: #E07856;
          border-radius: 50%;
          animation: spin 0.8s linear infinite;
          margin: 0 auto 20px;
        "></div>
        
        <h2 style="
          color: #2D2D2D;
          font-size: 24px;
          font-weight: 600;
          margin: 0;
        ">
          Cargando ReSirve...
        </h2>
        
        <p style="
          color: #9E9E9E;
          font-size: 14px;
          margin-top: 10px;
        ">
          Preparando tu catálogo
        </p>
      </div>
    </div>
    
    <style>
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </app-root>
  
  <!-- Noscript fallback -->
  <noscript>
    <div style="
      padding: 40px;
      text-align: center;
      background: #FAF7F2;
      min-height: 100vh;
    ">
      <h1 style="color: #2D2D2D; font-family: 'Playfair Display', serif;">
        JavaScript Requerido
      </h1>
      <p style="color: #666; font-family: 'Work Sans', sans-serif;">
        Por favor, activa JavaScript en tu navegador para usar ReSirve.
      </p>
    </div>
  </noscript>
</body>
</html>
